name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres/Redis, not mocked - packages/server/test/store/
    # postgres-store.test.ts and redis-session-store.test.ts are
    # genuine integration tests against these, matching this repo's
    # own "empirical over mocked" convention. Service containers bind
    # to the runner's own localhost since this job doesn't itself run
    # in a container.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin
          POSTGRES_DB: cms_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://admin:admin@localhost:5432/cms_admin
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - run: npm ci

      - run: npm run db:migrate --workspace packages/server

      # Same three gates CLAUDE.md's "definition of done" requires
      # locally (enforced there by the Stop hook) - now enforced on
      # every push/PR too, not just when someone remembers to run them.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
